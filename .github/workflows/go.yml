name: MoeDove Go
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        go-version: ['1.25.x', '1.27.x']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: sudo apt-get update && sudo apt-get install -y bird2 bind9-utils
      - run: go test -race -timeout 25m ./...
        env:
          BIRD_BIN: /usr/sbin/bird
          NAMED_CHECKZONE_BIN: /usr/bin/named-checkzone
      - run: go vet ./...
      - run: make build
      - run: make bundle
      - name: Check AS112 operational CLI entrypoint
        run: ./dist/ixp-as112 --help
