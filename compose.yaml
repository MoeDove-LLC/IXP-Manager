services:
  manager:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      IXP_SETUP_TOKEN: "${IXP_SETUP_TOKEN:?Set a random IXP_SETUP_TOKEN before starting Compose}"
    volumes:
      - moedove-data:/var/lib/moedove
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
volumes:
  moedove-data:
